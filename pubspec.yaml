name: shakti_bluetooth_chat
description: "Shakti Bluetooth Chat — premium offline Bluetooth messaging."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Bluetooth Classic (RFCOMM) - real device to device chat
  flutter_bluetooth_serial: ^0.4.0

  # Permissions
  permission_handler: ^11.3.1

  # File handling
  file_picker: ^8.0.6
  path_provider: ^2.1.4
  open_filex: ^4.5.0

  # QR
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3

  # Material You dynamic color
  dynamic_color: 1.8.1

  # App info (version number on Settings screen)
  package_info_plus: ^8.0.2

  # Animations
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.2
  collection: ^1.18.0
  equatable: ^2.0.5
  logger: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
