
name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Fix flutter_bluetooth_serial namespace
        shell: bash
        run: |
          PLUGIN_DIR=$(find "$HOME/.pub-cache/hosted/pub.dev" -maxdepth 1 -type d -name "flutter_bluetooth_serial-*" | head -n 1)

          if [ -z "$PLUGIN_DIR" ]; then
            echo "flutter_bluetooth_serial plugin not found"
            exit 1
          fi

          echo "Plugin found at: $PLUGIN_DIR"

          BUILD_FILE="$PLUGIN_DIR/android/build.gradle"

          if [ ! -f "$BUILD_FILE" ]; then
            echo "Build file not found: $BUILD_FILE"
            exit 1
          fi

          if grep -q "namespace" "$BUILD_FILE"; then
            echo "Namespace already exists."
          else
            sed -i '/android {/a\    namespace "com.eds.flutter_bluetooth_serial"' "$BUILD_FILE"
            echo "Namespace added successfully."
          fi

          echo "Updated build.gradle:"
          cat "$BUILD_FILE"

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: shakti-bluetooth-chat-apk
          path: build/app/outputs/flutter-apk/app-release.apk

