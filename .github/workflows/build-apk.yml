name: Build APK
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Fix flutter_bluetooth_serial namespace and compileSdk
        shell: bash
        run: |
          PLUGIN_DIR=$(find "$HOME/.pub-cache/hosted/pub.dev" -maxdepth 1 -type d -name "flutter_bluetooth_serial-*" | head -n 1)
          if [ -z "$PLUGIN_DIR" ]; then
            echo "flutter_bluetooth_serial plugin not found"
            exit 1
          fi
          echo "Plugin found at: $PLUGIN_DIR"
          BUILD_FILE="$PLUGIN_DIR/android/build.gradle"
          if [ ! -f "$BUILD_FILE" ]; then
            echo "Build file not found: $BUILD_FILE"
            exit 1
          fi
          if grep -q "namespace" "$BUILD_FILE"; then
            echo "Namespace already exists."
          else
            sed -i '/android {/a\    namespace "com.eds.flutter_bluetooth_serial"' "$BUILD_FILE"
            echo "Namespace added successfully."
          fi
          if grep -qE "compileSdkVersion" "$BUILD_FILE"; then
            sed -i -E 's/compileSdkVersion[[:space:]]+[0-9]+/compileSdkVersion 36/' "$BUILD_FILE"
            echo "compileSdkVersion updated to 36."
          else
            sed -i '/android {/a\    compileSdkVersion 36' "$BUILD_FILE"
            echo "compileSdkVersion added as 36."
          fi
          echo "Updated build.gradle:"
          cat "$BUILD_FILE"
      - name: Patch Bluetooth connect() for Android 12+ compatibility
        shell: bash
        run: |
          PLUGIN_DIR=$(find "$HOME/.pub-cache/hosted/pub.dev" -maxdepth 1 -type d -name "flutter_bluetooth_serial-*" | head -n 1)
          CONN_FILE="$PLUGIN_DIR/android/src/main/java/io/github/edufolly/flutterbluetoothserial/BluetoothConnection.java"
          if [ ! -f "$CONN_FILE" ]; then
            echo "BluetoothConnection.java not found at $CONN_FILE"
            exit 1
          fi
          echo "Patching: $CONN_FILE"
          cat > "$CONN_FILE" << 'JAVA_PATCH_EOF'
package io.github.edufolly.flutterbluetoothserial;

import java.io.IOException;
import java.io.InputStream;
import java.io.OutputStream;
import java.lang.reflect.Method;
import java.util.UUID;
import java.util.Arrays;

import android.bluetooth.BluetoothAdapter;
import android.bluetooth.BluetoothDevice;
import android.bluetooth.BluetoothSocket;
import android.util.Log;

/// Universal Bluetooth serial connection class (for Java)
///
/// PATCHED: falls back through secure -> insecure -> raw-channel-reflection
/// RFCOMM sockets because the original single-strategy connect() fails with
/// "read failed, socket might closed or timeout, read ret: -1" on Android 12+
/// and on several OEM Bluetooth stacks, even though it works fine on Android
/// 10/11. This mirrors the standard community workaround for this exact
/// plugin issue (edufolly/flutter_bluetooth_serial issues #18, #50, #146,
/// #150, #154, #164).
public abstract class BluetoothConnection
{
    private static final String TAG = "BluetoothConnection";
    protected static final UUID DEFAULT_UUID = UUID.fromString("00001101-0000-1000-8000-00805F9B34FB");

    protected BluetoothAdapter bluetoothAdapter;

    protected ConnectionThread connectionThread = null;

    public boolean isConnected() {
        return connectionThread != null && connectionThread.requestedClosing != true;
    }



    public BluetoothConnection(BluetoothAdapter bluetoothAdapter) {
        this.bluetoothAdapter = bluetoothAdapter;
    }



    /// Connects to given device by hardware address, trying multiple socket
    /// strategies so the connection survives on Android 12+ / flaky OEM
    /// Bluetooth stacks, not just on Android <=11.
    public void connect(String address, UUID uuid) throws IOException {
        if (isConnected()) {
            throw new IOException("already connected");
        }

        BluetoothDevice device = bluetoothAdapter.getRemoteDevice(address);
        if (device == null) {
            throw new IOException("device not found");
        }

        bluetoothAdapter.cancelDiscovery();

        IOException lastError = null;
        BluetoothSocket socket = null;

        try {
            socket = device.createRfcommSocketToServiceRecord(uuid);
            connectSocket(socket);
            Log.i(TAG, "Connected using secure createRfcommSocketToServiceRecord");
        } catch (IOException e) {
            lastError = e;
            Log.w(TAG, "Secure SDP socket failed, trying insecure: " + e.getMessage());
            closeQuietly(socket);
            socket = null;
            sleepQuietly(300);
        }

        if (socket == null || !socket.isConnected()) {
            try {
                socket = device.createInsecureRfcommSocketToServiceRecord(uuid);
                connectSocket(socket);
                Log.i(TAG, "Connected using insecure createInsecureRfcommSocketToServiceRecord");
            } catch (IOException e) {
                lastError = e;
                Log.w(TAG, "Insecure SDP socket failed, trying reflection channel 1: " + e.getMessage());
                closeQuietly(socket);
                socket = null;
                sleepQuietly(300);
            }
        }

        if (socket == null || !socket.isConnected()) {
            try {
                socket = createRfcommSocketViaReflection(device, 1);
                connectSocket(socket);
                Log.i(TAG, "Connected using reflection createRfcommSocket(channel=1)");
            } catch (Exception e) {
                lastError = (e instanceof IOException) ? (IOException) e : new IOException(e);
                closeQuietly(socket);
                socket = null;
            }
        }

        if (socket == null || !socket.isConnected()) {
            throw (lastError != null) ? lastError : new IOException("socket connection not established");
        }

        connectionThread = new ConnectionThread(socket);
        connectionThread.start();
    }
    /// Connects to given device by hardware address (default UUID used)
    public void connect(String address) throws IOException {
        connect(address, DEFAULT_UUID);
    }

    private void connectSocket(BluetoothSocket socket) throws IOException {
        if (socket == null) {
            throw new IOException("socket connection not established");
        }
        try {
            socket.connect();
        } catch (IOException first) {
            sleepQuietly(250);
            socket.connect();
        }
    }

    private BluetoothSocket createRfcommSocketViaReflection(BluetoothDevice device, int channel) throws Exception {
        Method m = device.getClass().getMethod("createRfcommSocket", new Class[] {int.class});
        return (BluetoothSocket) m.invoke(device, channel);
    }

    private void closeQuietly(BluetoothSocket socket) {
        if (socket == null) return;
        try { socket.close(); } catch (Exception ignored) {}
    }

    private void sleepQuietly(long millis) {
        try { Thread.sleep(millis); } catch (InterruptedException ignored) {}
    }

    /// Disconnects current session (ignore if not connected)
    public void disconnect() {
        if (isConnected()) {
            connectionThread.cancel();
            connectionThread = null;
        }
    }

    /// Writes to connected remote device 
    public void write(byte[] data) throws IOException {
        if (!isConnected()) {
            throw new IOException("not connected");
        }

        connectionThread.write(data);
    }

    /// Callback for reading data.
    protected abstract void onRead(byte[] data);

    /// Callback for disconnection.
    protected abstract void onDisconnected(boolean byRemote);

    /// Thread to handle connection I/O
    private class ConnectionThread extends Thread  {
        private final BluetoothSocket socket;
        private final InputStream input;
        private final OutputStream output;
        private boolean requestedClosing = false;
        
        ConnectionThread(BluetoothSocket socket) {
            this.socket = socket;
            InputStream tmpIn = null;
            OutputStream tmpOut = null;

            try {
                tmpIn = socket.getInputStream();
                tmpOut = socket.getOutputStream();
            } catch (IOException e) {
                e.printStackTrace();
            }

            this.input = tmpIn;
            this.output = tmpOut;
        }

        /// Thread main code
        public void run() {
            byte[] buffer = new byte[1024];
            int bytes;

            while (!requestedClosing) {
                try {
                    bytes = input.read(buffer);

                    onRead(Arrays.copyOf(buffer, bytes));
                } catch (IOException e) {
                    break;
                }
            }

            if (output != null) {
                try {
                    output.close();
                }
                catch (Exception e) {}
            }

            if (input != null) {
                try {
                    input.close();
                }
                catch (Exception e) {}
            }

            onDisconnected(!requestedClosing);

            requestedClosing = true;
        }

        /// Writes to output stream
        public void write(byte[] bytes) {
            try {
                output.write(bytes);
            } catch (IOException e) {
                e.printStackTrace();
            }
        }

        /// Stops the thread, disconnects
        public void cancel() {
            if (requestedClosing) {
                return;
            }
            requestedClosing = true;

            try {
                output.flush();
            }
            catch (Exception e) {}

            if (socket != null) {
                try {
                    Thread.sleep(111);

                    socket.close();
                }
                catch (Exception e) {}
            }
        }
    }
}
JAVA_PATCH_EOF
          echo "Patch applied. First 20 lines of patched file:"
          head -20 "$CONN_FILE"
      - name: Build APK (release)
        run: flutter build apk --release
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: shakti-bluetooth-chat-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          
